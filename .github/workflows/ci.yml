name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci
        
    - name: Lint Frontend
      run: |
        cd frontend
        npm run lint
        
    - name: Typecheck Backend
      run: |
        cd backend
        npx tsc --noEmit
